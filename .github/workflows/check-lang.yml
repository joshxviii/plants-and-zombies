name: Check Language Files

on:
  pull_request:
    paths:
      - 'src/main/resources/assets/plantz/lang/**'
  push:
    paths:
      - 'src/main/resources/assets/plantz/lang/**'
  workflow_dispatch:

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check language files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            LEFT_SHA="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            LEFT_SHA="$(git rev-parse "$CURRENT_SHA^" 2>/dev/null || true)"
            if [ -z "$LEFT_SHA" ]; then
              python .github/scripts/check_lang.py
              exit 0
            fi
          else
            LEFT_SHA="$PUSH_BEFORE_SHA"
          fi

          git fetch --no-tags --depth=1 origin "$LEFT_SHA"
          git diff --name-only -z --diff-filter=AM "$LEFT_SHA" "$CURRENT_SHA" -- \
            'src/main/resources/assets/plantz/lang/*.json' > "$RUNNER_TEMP/changed-lang-files"

          mapfile -d '' -t changed_paths < "$RUNNER_TEMP/changed-lang-files"
          files=()
          for path in "${changed_paths[@]}"; do
            filename="${path##*/}"
            if [ "$filename" != "en_us.json" ]; then
              files+=("$filename")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No translation files changed – skipping."
            exit 0
          fi

          echo "Files to check:"
          printf '  %s\n' "${files[@]}"
          python .github/scripts/check_lang.py "${files[@]}"
